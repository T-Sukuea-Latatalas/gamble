<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビデオポーカー PRO - Fever Casino</title>
  <!-- ① 共通デザイン（ATMモーダル・基本スタイル）の読み込み -->
  <link rel="stylesheet" href="style.css">
  <!-- ② ポーカー専用デザインの読み込み -->
  <link rel="stylesheet" href="game-poker.css">
  <!-- ③ 共通テンキー用CSS -->
  <link rel="stylesheet" href="keypad.css">
</head>
<body>

  <!-- お祝いコイン粒子コンテナ -->
  <div id="particle-container"></div>

  <div class="game-container" id="poker-container">
    
    <!-- ヘッダーエリア -->
    <header class="game-header">
      <a href="index.html" class="header-btn">🏠 ロビーに戻る</a>
      <h1 class="game-title">♠ VIDEO POKER PRO</h1>
      
      <div class="player-status">
        <div class="status-item">
          <span class="status-label">所持金:</span>
          <span id="cash-display" class="status-value">$0</span>
        </div>
        <div class="status-item">
          <span class="status-label">借金:</span>
          <span id="debt-display" class="status-value debt-value">$0</span>
        </div>
        <!-- ATM起動ボタン -->
        <button type="button" id="open-atm-btn" class="open-atm-btn">🏦 ATM</button>
      </div>
    </header>

    <!-- メインエリア -->
    <main class="poker-main">

      <!-- 配当一覧表 (ペイテーブル) -->
      <section class="paytable">
        <div class="pay-row" id="pay-royal"><span>ロイヤルストレートフラッシュ</span><b>250倍</b></div>
        <div class="pay-row" id="pay-sf"><span>ストレートフラッシュ</span><b>50倍</b></div>
        <div class="pay-row" id="pay-4k"><span>フォーカード</span><b>25倍</b></div>
        <div class="pay-row" id="pay-fh"><span>フルハウス</span><b>9倍</b></div>
        <div class="pay-row" id="pay-fl"><span>フラッシュ</span><b>6倍</b></div>
        <div class="pay-row" id="pay-st"><span>ストレート</span><b>4倍</b></div>
        <div class="pay-row" id="pay-3k"><span>スリーカード</span><b>3倍</b></div>
        <div class="pay-row" id="pay-2p"><span>ツーペア</span><b>2倍</b></div>
        <div class="pay-row" id="pay-job"><span>ジャックス・オア・ベター (J以上のペア)</span><b>1倍</b></div>
      </section>

      <!-- メッセージ表示エリア -->
      <div id="poker-message" class="poker-message">
        賭け金を選択して「ディール」を押してください
      </div>

      <!-- 3Dフリップ対応の手札5枚表示エリア -->
      <section id="cards-container" class="cards-container">
        <div class="poker-card-wrapper" data-index="0">
          <div class="hold-badge">HOLD</div>
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"></div>
          </div>
        </div>
        <div class="poker-card-wrapper" data-index="1">
          <div class="hold-badge">HOLD</div>
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"></div>
          </div>
        </div>
        <div class="poker-card-wrapper" data-index="2">
          <div class="hold-badge">HOLD</div>
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"></div>
          </div>
        </div>
        <div class="poker-card-wrapper" data-index="3">
          <div class="hold-badge">HOLD</div>
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"></div>
          </div>
        </div>
        <div class="poker-card-wrapper" data-index="4">
          <div class="hold-badge">HOLD</div>
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"></div>
          </div>
        </div>
      </section>

      <!-- コントロールパネル -->
      <section class="control-panel">
        <div id="bet-group" class="control-group">
          <!-- バーチャルテンキー連動ボタン -->
          <button type="button" 
                  id="bet-select-btn" 
                  class="amount-select-btn" 
                  data-amount="10" 
                  data-label="賭け金: " 
                  data-max="10000">
            賭け金: $10
          </button>
          <button id="deal-btn" class="action-btn main-btn" type="button">🃏 ディール (配る)</button>
        </div>

        <div id="action-group" class="control-group hidden">
          <button id="draw-btn" class="action-btn draw-btn" type="button">🔄 ドロー (入れ替え)</button>
        </div>

        <div id="next-group" class="control-group hidden">
          <button id="next-btn" class="action-btn main-btn" type="button">✨ 次のゲームへ</button>
        </div>
      </section>

    </main>

  </div>

  <!-- ★ ATMモーダルウィンドウ ★ -->
  <div id="atm-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>🏦 カジノ銀行（ATM）</h2>
        <button id="close-atm-btn" class="close-btn" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="atm-step-section">
          <p class="step-title">① 取引メニューを選択:</p>
          <div class="atm-mode-grid">
            <button class="mode-btn deposit" type="button" data-mode="deposit">預ける</button>
            <button class="mode-btn withdraw" type="button" data-mode="withdraw">引き出す</button>
            <button class="mode-btn repay" type="button" data-mode="repay">返済する</button>
            <button class="mode-btn borrow" type="button" data-mode="borrow">借金する</button>
          </div>
        </div>
        <div id="atm-action-panel" class="atm-action-panel hidden">
          <div class="selected-mode-badge">選択中: <b id="selected-mode-text">-</b></div>
          <p class="step-title">② 金額を指定して確定:</p>
          <div class="action-row">
            <button type="button" id="atm-amount-btn" class="amount-select-btn" data-amount="0" data-label="取引額: ">金額を入力: $0</button>
            <button id="atm-execute-btn" class="execute-btn" type="button">✅ 取引を確定</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ② JavaScriptファイルの読み込み -->
  <script src="lobby.js"></script>
  <script src="atm.js"></script>
  <script src="spreadsheet.js"></script>
  <script src="keypad.js"></script>
  <script src="game-poker.js"></script>

</body>
</html>
