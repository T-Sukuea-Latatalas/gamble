<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CR FEVER CASINO パチンコ - Fever Casino</title>
  <!-- ① 共通デザイン（ATMモーダル・基本スタイル）の読み込み -->
  <link rel="stylesheet" href="style.css">
  <!-- ② 共通テンキー用CSS -->
  <link rel="stylesheet" href="keypad.css">
  <!-- ③ パチンコ専用デザインの読み込み -->
  <link rel="stylesheet" href="game-pachinko.css">
</head>
<body>

  <!-- 当たり時のお祝い粒子コンテナ -->
  <div id="particle-container"></div>

  <!-- ヴィンテージ木枠風 パチンコ筐体コンテナ -->
  <div class="game-container pachinko-vintage-cabinet" id="pachinko-container">
    
    <!-- ヘッダーエリア -->
    <header class="game-header">
      <a href="index.html" class="header-btn">🏠 ロビーに戻る</a>
      <h1 class="game-title">🎰 CR FEVER PACHINKO</h1>
      
      <div class="player-status">
        <div class="status-item">
          <span class="status-label">所持金:</span>
          <span id="cash-display" class="status-value">$0</span>
        </div>
        <div class="status-item">
          <span class="status-label">借金:</span>
          <span id="debt-display" class="status-value debt-value">$0</span>
        </div>
        <!-- ATM起動ボタン -->
        <button type="button" id="open-atm-btn" class="open-atm-btn">🏦 ATM</button>
      </div>
    </header>

    <!-- モードバナー（通常 / 超確変RUSH / 時短ゾーン） -->
    <div id="fever-banner" class="fever-banner mode-normal">
      <span id="mode-badge-text">通常モード (大当り確率 1/99)</span>
    </div>

    <!-- 液晶上部 レトロデータカウンタ -->
    <div class="pachinko-stats-bar">
      <div class="stat-box">
        <span class="stat-label">回転数</span>
        <span id="stat-spins" class="stat-val">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">大当り</span>
        <span id="stat-jackpots" class="stat-val">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">RUSH連打</span>
        <span id="stat-rush-count" class="stat-val">0</span>
      </div>
      <div class="stat-box highlight">
        <span class="stat-label">獲得出玉</span>
        <span id="stat-payout" class="stat-val">$0</span>
      </div>
    </div>

    <!-- メイン筐体領域 -->
    <main class="pachinko-main">

      <!-- パチンコ盤面（正村ゲージ・真鍮円形レール Canvas） -->
      <section class="pachinko-board-wrapper">
        <canvas id="pachinko-canvas" width="440" height="600"></canvas>
        
        <!-- PUSHボタン一撃決動演出用オーバーレイ -->
        <div id="push-overlay" class="push-overlay hidden">
          <div class="push-msg">ボタンをPUSHせよ!!</div>
          <button id="screen-push-btn" class="screen-push-btn" type="button">
            🔴 PUSH!
          </button>
        </div>
      </section>

      <!-- アナウンスディスプレイ -->
      <div id="pachinko-message" class="pachinko-message">
        ハンドルを調整し「玉を発射」または「自動発射 ON」で正村ゲージへ打ち込め！
      </div>

      <!-- コントロールパネル -->
      <section class="control-panel">
        
        <!-- 上段：1球価格設定 ＆ 保留ランプ表示 -->
        <div class="bet-input-group">
          <button type="button" 
                  id="bet-select-btn" 
                  class="amount-select-btn use-keypad" 
                  data-amount="10" 
                  data-label="1球価格: ">
            1球価格: $10
          </button>
          
          <div class="hold-indicator">
            <span class="hold-title">保留:</span>
            <div id="hold-lamps" class="hold-lamps-container">
              <span class="hold-lamp" id="hl-0"></span>
              <span class="hold-lamp" id="hl-1"></span>
              <span class="hold-lamp" id="hl-2"></span>
              <span class="hold-lamp" id="hl-3"></span>
            </div>
          </div>
        </div>

        <!-- 中段：打ち出しパワー調整ハンドルコントロール -->
        <div class="power-control-group">
          <label for="power-slider" class="power-label">
            打ち出し強度 (ハンドル): <b id="power-val-text">75%</b>
          </label>
          <div class="power-slider-wrapper">
            <span class="power-min">弱</span>
            <input type="range" id="power-slider" min="30" max="100" value="75" step="1">
            <span class="power-max">強</span>
          </div>
          <div class="power-preset-btns">
            <button type="button" class="preset-btn" data-power="50">弱打ち (50%)</button>
            <button type="button" class="preset-btn active" data-power="75">ブッコミ (75%)</button>
            <button type="button" class="preset-btn" data-power="95">強打ち (95%)</button>
          </div>
        </div>

        <!-- 下段：操作ボタン群 -->
        <div class="action-btn-group">
          <button id="shoot-btn" class="shoot-btn" type="button">⚡ 玉を発射 (1球)</button>
          <button id="auto-btn" class="auto-btn" type="button">🔄 自動発射: OFF</button>
          <button id="manual-push-btn" class="manual-push-btn" type="button">🔴 PUSH</button>
        </div>
      </section>

    </main>

  </div>

  <!-- ★ ATMモーダルウィンドウ ★ -->
  <div id="atm-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>🏦 カジノ銀行（ATM）</h2>
        <button id="close-atm-btn" class="close-btn" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="atm-step-section">
          <p class="step-title">① 取引メニューを選択:</p>
          <div class="atm-mode-grid">
            <button class="mode-btn deposit" type="button" data-mode="deposit">預ける</button>
            <button class="mode-btn withdraw" type="button" data-mode="withdraw">引き出す</button>
            <button class="mode-btn repay" type="button" data-mode="repay">返済する</button>
            <button class="mode-btn borrow" type="button" data-mode="borrow">借金する</button>
          </div>
        </div>
        <div id="atm-action-panel" class="atm-action-panel hidden">
          <div class="selected-mode-badge">選択中: <b id="selected-mode-text">-</b></div>
          <p class="step-title">② 金額を指定して確定:</p>
          <div class="action-row">
            <button type="button" id="atm-amount-btn" class="amount-select-btn" data-amount="0" data-label="取引額: ">金額を入力: $0</button>
            <button id="atm-execute-btn" class="execute-btn" type="button">✅ 取引を確定</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScriptファイルの読み込み -->
  <script src="lobby.js"></script>
  <script src="atm.js"></script>
  <script src="spreadsheet.js"></script>
  <script src="keypad.js"></script>
  <script src="game-pachinko.js"></script>

</body>
</html>
