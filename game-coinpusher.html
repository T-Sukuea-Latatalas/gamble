<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D コインプッシャー PRO - Fever Casino</title>
  <!-- 共通スタイルの読み込み -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="keypad.css">
  <!-- 3D コインプッシャー専用スタイル -->
  <link rel="stylesheet" href="game-coinpusher.css">
  <!-- Three.js (r128) の読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 当たり時のお祝い粒子コンテナ -->
  <div id="particle-container"></div>

  <div class="game-container coinpusher-3d-cabinet" id="pusher-container">
    
    <!-- ヘッダーエリア -->
    <header class="game-header">
      <a href="index.html" class="header-btn">🏠 ロビーに戻る</a>
      <h1 class="game-title">🪙 3D CRAFT COIN PUSHER</h1>
      
      <div class="player-status">
        <div class="status-item">
          <span class="status-label">所持金:</span>
          <span id="cash-display" class="status-value">$0</span>
        </div>
        <div class="status-item">
          <span class="status-label">借金:</span>
          <span id="debt-display" class="status-value debt-value">$0</span>
        </div>
        <button type="button" id="open-atm-btn" class="open-atm-btn">🏦 ATM</button>
      </div>
    </header>

    <!-- 獲得カウンタバー -->
    <div class="pusher-stats-bar">
      <div class="stat-box">
        <span class="stat-label">フィールド枚数</span>
        <span id="stat-coins-count" class="stat-val">0</span>
      </div>
      <div class="stat-box highlight">
        <span class="stat-label">今回獲得額</span>
        <span id="stat-payout" class="stat-val">$0</span>
      </div>
      <div class="stat-box jackpot">
        <span class="stat-label">ルーレット当選</span>
        <span id="stat-jackpot-win" class="stat-val">-</span>
      </div>
    </div>

    <!-- 3D 物理メイン領域 -->
    <main class="pusher-main">

      <!-- Three.js 3Dキャンバスラッパー（直接タッチ/ドラッグ操作領域） -->
      <section class="pusher-3d-wrapper">
        <div id="pusher-3d-canvas" class="pusher-3d-canvas"></div>
      </section>

      <!-- コントロールパネル -->
      <section class="control-panel">
        
        <!-- 1枚のコイン価値設定（keypad.js 連動） -->
        <div class="bet-input-group">
          <button type="button" 
                  id="bet-select-btn" 
                  class="amount-select-btn use-keypad" 
                  data-amount="10" 
                  data-label="1枚価値: ">
            1枚価値: $10
          </button>
        </div>

        <!-- 操作ボタン群 -->
        <div class="action-btn-group">
          <button id="drop-btn" class="drop-btn" type="button">🪙 コイン投入 (1枚)</button>
          <button id="auto-btn" class="auto-btn" type="button">🔄 連射: OFF</button>
        </div>
      </section>

    </main>

  </div>

  <!-- ★ ATMモーダルウィンドウ ★ -->
  <div id="atm-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>🏦 カジノ銀行（ATM）</h2>
        <button id="close-atm-btn" class="close-btn" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="atm-step-section">
          <p class="step-title">① 取引メニューを選択:</p>
          <div class="atm-mode-grid">
            <button class="mode-btn deposit" type="button" data-mode="deposit">預ける</button>
            <button class="mode-btn withdraw" type="button" data-mode="withdraw">引き出す</button>
            <button class="mode-btn repay" type="button" data-mode="repay">返済する</button>
            <button class="mode-btn borrow" type="button" data-mode="borrow">借金する</button>
          </div>
        </div>
        <div id="atm-action-panel" class="atm-action-panel hidden">
          <div class="selected-mode-badge">選択中: <b id="selected-mode-text">-</b></div>
          <p class="step-title">② 金額を指定して確定:</p>
          <div class="action-row">
            <button type="button" id="atm-amount-btn" class="amount-select-btn" data-amount="0" data-label="取引額: ">金額を入力: $0</button>
            <button id="atm-execute-btn" class="execute-btn" type="button">✅ 取引を確定</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScriptスクリプト群の読み込み -->
  <script src="lobby.js"></script>
  <script src="atm.js"></script>
  <script src="spreadsheet.js"></script>
  <script src="keypad.js"></script>
  <script src="game-coinpusher.js"></script>

</body>
</html>
